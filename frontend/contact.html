<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Feedback - Web User Behaviour Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>

    <div class="tracking-badge">
        <div class="pulse-dot"></div>
        <span>Behavior Tracker Active</span>
        <a href="/sem7_dashboard.html" class="btn btn-sm btn-primary ms-2 py-0 px-2" style="font-size: 11px;">View Dashboard</a>
    </div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/" id="nav-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
                WUBA Analytics Demo
            </a>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/" id="nav-home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/products.html" id="nav-products">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="/blog.html" id="nav-blog">Research Blog</a></li>
                    <li class="nav-item"><a class="nav-link active fw-semibold" href="/contact.html" id="nav-contact">Contact</a></li>
                </ul>
                <a href="/sem7_dashboard.html" class="btn btn-outline-primary" id="btn-nav-dashboard">📊 Analytics Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container py-5" style="max-width: 700px;">
        <div class="card p-4 p-md-5 border rounded-4 shadow-sm bg-white">
            <h2 class="fw-bold mb-2">Get in Touch / Provide Feedback</h2>
            <p class="text-muted mb-4">Every input interaction and button click is captured by the tracking pipeline for behavioral workflow analysis.</p>

            <form id="contact-form" onsubmit="event.preventDefault(); alert('Form submitted! Interaction captured.');">
                <div class="mb-3">
                    <label for="contact-name" class="form-label fw-semibold">Your Full Name</label>
                    <input type="text" class="form-control" id="contact-name" placeholder="e.g. Manik Chandra Panday">
                </div>
                <div class="mb-3">
                    <label for="contact-email" class="form-label fw-semibold">Email Address</label>
                    <input type="email" class="form-control" id="contact-email" placeholder="name@college.edu">
                </div>
                <div class="mb-3">
                    <label for="contact-topic" class="form-label fw-semibold">Inquiry Type</label>
                    <select class="form-select" id="contact-topic">
                        <option value="evaluation">Semester VII Project Evaluation</option>
                        <option value="research">Academic Research & Methodology</option>
                        <option value="collaboration">Industry / Open Source Adoption</option>
                        <option value="other">General Query</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="contact-message" class="form-label fw-semibold">Message / Feedback</label>
                    <textarea class="form-control" id="contact-message" rows="4" placeholder="Enter comments or suggestions regarding the analytics model..."></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary fw-semibold px-4" id="btn-submit-feedback">Send Message</button>
                    <button type="reset" class="btn btn-outline-secondary" id="btn-reset-form">Reset</button>
                    <a href="/sem7_dashboard.html" class="btn btn-outline-dark ms-auto" id="btn-view-tracker-stats">Inspect Logs &rarr;</a>
                </div>
            </form>
        </div>
    </div>

    <script src="/public/js/tracker.js"></script>
</body>
</html>
